name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: Verify and pack release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No `version` here on purpose: the action reads packageManager from
      # package.json. Passing both is a hard error in pnpm/action-setup@v4.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: ./scripts/verify-pack.sh
      - name: Pack release artifact
        run: |
          mkdir -p dist/release
          pnpm pack --pack-destination dist/release
          cd dist/release
          sha256sum landasika-dshell-*.tgz > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: dshell-release
          path: |
            dist/release/*.tgz
            dist/release/SHA256SUMS
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: verify-and-pack
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # npm provenance signs the published package with the workflow's OIDC
      # identity, tying the tarball to this exact tag.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dshell-release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the verified tarball
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo '::notice::NPM_TOKEN secret is not configured; skipping npm publish'
            exit 0
          fi
          npm publish --access public --provenance ./landasika-dshell-*.tgz
